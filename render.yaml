services:
  - type: web
    name: ncgg-attendance-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_GUILD_ID
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: READER_BRIDGE_TOKEN
        sync: false
